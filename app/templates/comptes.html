{% extends "base.html" %}
{% block contenu %}
<h1>Comptes des opérateurs</h1>
<div class="tableau-defile"><table style="max-width:820px">
<tr><th>Identifiant</th><th>Nom</th><th>Rôle</th><th>Telegram (escalade)</th><th>Actif</th></tr>
{% for c in comptes %}<tr><td>{{ c.identifiant }}</td><td>{{ c.nom }}</td><td>{{ c.role }}</td><td>{{ c.telegram_chat or '—' }}</td><td>{{ 'oui' if c.actif else 'non' }}</td></tr>{% endfor %}
</table></div>
<h2>Créer ou modifier un compte</h2>
<form method="post" class="carte" style="max-width:640px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Identifiant</label><input type="text" name="identifiant" required pattern="[a-z0-9._-]{3,40}">
  <label>Nom affiché</label><input type="text" name="nom" required maxlength="80">
  <label>Mot de passe (10 caractères minimum)</label><input type="password" name="mot_de_passe" required minlength="10" autocomplete="new-password">
  <label>Rôle</label><select name="role"><option value="operateur">Opérateur</option><option value="admin">Administrateur</option></select>
  <label>Identifiant de chat Telegram (reçoit les demandes de validation et les escalades)</label><input type="text" name="telegram_chat">
  <p style="margin-top:14px"><button>Enregistrer</button></p>
</form>
{% endblock %}
